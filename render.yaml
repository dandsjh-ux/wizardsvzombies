# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wizards-vs-zombies
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
